stages:
  - test
  - pages
  - release

test:
  stage: test
  image: golang:1.27
  tags:
    - docker
  variables:
    # The image's /go and /root/.cache are root-owned; redirect both so the
    # unprivileged `ci` user below has writable build caches.
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-cache
  before_script:
    # The test suite refuses to run as root, but the runner starts the
    # container as root and we can't touch the runner config — so create an
    # unprivileged user and hand it the repo plus the caches.
    - useradd -m -u 1000 ci
    - mkdir -p "$GOPATH" "$GOCACHE"
    - chown -R ci:ci "$GOPATH" "$GOCACHE" "$CI_PROJECT_DIR"
  script:
    - su ci -c 'make test'

pages:
  stage: pages
  image: golang:1.27
  tags:
    - docker
  script:
    - make site
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

release:
  stage: release
  image: golang:1.27
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  variables:
    # GitLab's internal CA is self-signed; point Go's TLS stack at the runner-
    # provided CA bundle so goreleaser can reach the releases API.
    SSL_CERT_FILE: $CI_SERVER_TLS_CA_FILE
  before_script:
    - test -n "$SSL_CERT_FILE" && test -r "$SSL_CERT_FILE"
    - go install github.com/goreleaser/goreleaser/v2@v2
  script:
    - goreleaser release --clean
