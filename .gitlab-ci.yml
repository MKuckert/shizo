stages:
  - test
  - pages
  - release

test:
  stage: test
  image: golang:1.27
  tags:
    - docker
  script:
    - make test

pages:
  stage: pages
  image: golang:1.27
  tags:
    - docker
  script:
    - make site
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

release:
  stage: release
  image: golang:1.27
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  before_script:
    - go install github.com/goreleaser/goreleaser/v2@v2
  script:
    - goreleaser release --clean
