version: 2

project_name: shizo

builds:
  - dir: src
    binary: shizo
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: src/shizo.sh
        dst: .
      - src: conf/**/*
        dst: conf

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  gitlab:
    owner: "{{ .Env.CI_PROJECT_NAMESPACE }}"
    name: "{{ .Env.CI_PROJECT_NAME }}"
  extra_files: []

gitlab_urls:
  api: https://gitlab.ssc-os.local/api/v4
  download: https://gitlab.ssc-os.local
